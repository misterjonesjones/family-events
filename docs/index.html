<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Familien-Events</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="top">
      <h1>Familien-Events</h1>
      <a class="ics" href="all.ics">ICS</a>
    </div>

    <div class="controls">
      <input id="q" type="search" placeholder="Suche…" />

      <select id="range">
        <option value="all">Alle</option>
        <option value="7">Nächste 7 Tage</option>
        <option value="14" selected>Nächste 14 Tage</option>
        <option value="30">Nächste 30 Tage</option>
      </select>

      <select id="source"><option value="">Quelle</option></select>
      <select id="center"><option value="">Zentrum</option></select>

      <select id="weekday">
        <option value="">Wochentag</option>
        <option value="1">Mo</option><option value="2">Di</option><option value="3">Mi</option>
        <option value="4">Do</option><option value="5">Fr</option><option value="6">Sa</option><option value="0">So</option>
      </select>

      <select id="tod">
        <option value="">Tageszeit</option>
        <option value="morning">Vormittag</option>
        <option value="afternoon">Nachmittag</option>
        <option value="evening">Abend</option>
      </select>

      <label class="chk"><input id="onlyNew" type="checkbox" /> Neu</label>
      <label class="chk"><input id="onlyFree" type="checkbox" /> Gratis</label>
      <label class="chk"><input id="onlySignup" type="checkbox" /> Anmeldung</label>

      <button id="reset">Reset</button>
    </div>

    <div class="meta" id="meta"></div>
  </header>

  <main>
    <ul id="list" class="list"></ul>
  </main>

  <footer>
    <span id="updated"></span>
    <span class="sep">·</span>
    <a id="share" href="#">Link mit Filtern</a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
