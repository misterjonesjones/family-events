name: Update events

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install requests beautifulsoup4 pyyaml python-dateutil

      - name: Fetch events
        run: |
          python scripts/fetch_events.py

      - name: Show generated files
        run: |
          echo "=== repo root ==="
          ls -la
          echo "=== docs ==="
          ls -la docs || true
          echo "=== find outputs ==="
          find . -maxdepth 3 -type f \( -name "events.json" -o -name "events.meta.json" -o -name "all.ics" \) -print -ls || true

      - name: Commit changes
        run: |
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"

          # Add BOTH root and docs outputs (important for GitHub Pages /docs)
          git add events.json events.meta.json 2>/dev/null || true
          git add docs/events.json docs/events.meta.json docs/all.ics 2>/dev/null || true

          # Ignore python cache
          git rm -r --cached scripts/__pycache__ 2>/dev/null || true

          echo "=== git status ==="
          git status --porcelain -uall

          git commit -m "Update events" || exit 0
          git push
