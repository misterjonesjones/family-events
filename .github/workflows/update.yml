name: Update events

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch events
        run: |
          python scripts/fetch_events.py

      - name: Show generated files
        run: |
          echo "=== repo root ==="
          ls -la
          echo "=== docs ==="
          ls -la docs || true

      - name: Commit changes
        run: |
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"

          # add generated files
          git add events.json events.meta.json docs/all.ics

          # ignore python cache if present
          git rm -r --cached scripts/__pycache__ 2>/dev/null || true

          echo "=== git status ==="
          git status --porcelain -uall

          git commit -m "Update events" || exit 0
          git push
