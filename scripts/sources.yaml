# sources.yaml (events 2.0)
defaults:
  timezone: Europe/Zurich
  user_agent: "family-events-bot/2.0 (+https://misterjonesjones.github.io/family-events/)"

sources:
  - id: elch
    name: "Zentrum ELCH"
    type: elch_html
    enabled: true
    centers:
      - id: cece
        name: "Zentrum ELCH CeCe-Areal"
        listing_url: "https://zentrumelch.ch/familienzentren-zuerich-elch/cece-areal/angebote"
      - id: accu
        name: "Zentrum ELCH Accu"
        listing_url: "https://zentrumelch.ch/angebote-accu"
      - id: frieden
        name: "Zentrum ELCH Frieden"
        listing_url: "https://zentrumelch.ch/familienzentren-zuerich-elch/frieden/angebote"
      - id: krokodil
        name: "Zentrum Krokodil"
        listing_url: "https://zentrumelch.ch/familienzentren-zuerich-elch/krokodil/angebote"
      - id: regensbergstrasse
        name: "Zentrum ELCH Regensbergstrasse"
        listing_url: "https://zentrumelch.ch/familienzentren-zuerich-elch/regensbergstrasse/angebote"

  - id: gz
    name: "GZ Zürich"
    type: gz_index
    enabled: true
    index_url: "https://gz-zh.ch/"
