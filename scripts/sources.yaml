    name: "Karussell Baden"
    type: karussell_crawl
    enabled: true
    start_urls:
      - "https://www.karussell-baden.ch/angebote/uebersicht/"
      - "https://www.karussell-baden.ch/angebote/jahresprogramm/"
      - "https://www.karussell-baden.ch/angebote/aktuell/"
